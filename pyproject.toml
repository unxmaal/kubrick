[project]
name = "kubrick"
version = "0.1.0"
description = "Directing run books and breakdown tooling for generative short films"
readme = "README.md"
authors = [
    { name = "Eric Dodd", email = "eric.e.dodd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "opentimelineio>=0.18.1",
    "pyobjc-framework-quartz>=12.2.2",
    "pyobjc-framework-vision>=12.2.2",
    "scenedetect[opencv-headless]>=0.7.2",
    "scikit-learn>=1.9.1",
    "transformers>=5.20.2",
    "transnetv2-pytorch>=1.0.5",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
kubrick = "kubrick.cli:main"

